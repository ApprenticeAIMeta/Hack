[project]
name = "apprentice"
version = "0.1.0"
description = "ApprenticeAI backend: compile expert sessions into procedures and guide novices live"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "python-dotenv>=1.0",
    "meta-sam-parser>=0.1.0",
    "scipy>=1.13",
    "torch>=2.5",
    "transformers>=4.45",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=13",
    "av>=14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apprentice"]
