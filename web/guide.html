<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Apprentice guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --metal: #D5D9DC; --panel: #F4F6F7; --ink: #1C2226; --ink-soft: #4A545B;
    --blue: #1E5AA8; --red: #C2312B; --yellow: #F5C400; --green: #2E7D4F;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--metal); color: var(--ink); font: 500 20px/1.3 Barlow, system-ui, sans-serif;
    display: flex; flex-direction: column; padding: 14px 16px 16px; gap: 12px; overflow: hidden;
  }
  /* Read at arm's length with both hands busy: big type, one step, no controls */
  .ticks { display: flex; gap: 5px; }
  .ticks i { flex: 1; height: 9px; border-radius: 3px; background: #B4BBC0; }
  .ticks i.done { background: var(--green); }
  .ticks i.now { background: var(--blue); }
  .count { font: 600 21px "Barlow Condensed", sans-serif; color: var(--ink-soft); margin-top: 8px; }
  h1 { font: 700 42px/1.02 "Barlow Condensed", sans-serif; }
  .instr { font-size: 22px; line-height: 1.25; }
  .compare { flex: 1; min-height: 0; display: grid; grid-template-rows: 1fr 1fr; gap: 8px; }
  figure { position: relative; min-height: 0; }
  figcaption {
    position: absolute; z-index: 1; top: 4px; left: 4px; padding: 2px 10px 3px; border-radius: 8px 0 8px 0;
    font: 600 19px "Barlow Condensed", sans-serif; color: #fff;
  }
  .expert figcaption { background: var(--red); }
  .yours figcaption { background: var(--blue); }
  .pic { position: absolute; inset: 0; background: var(--ink); border: 4px solid; border-radius: 12px; overflow: hidden; }
  .pic img, .pic canvas { width: 100%; height: 100%; object-fit: contain; display: block; }
  .expert .pic { border-color: var(--red); }
  .yours .pic { border-color: var(--blue); }
  .said { background: var(--panel); border-radius: 12px; padding: 10px 14px; font-size: 19px; }
  .said small { display: block; font: 600 16px "Barlow Condensed", sans-serif; color: var(--ink-soft); }
  .hint { background: var(--ink); color: #fff; border-radius: 12px; padding: 10px 14px; font-weight: 600; }
  [hidden] { display: none !important; }

  .cover { position: fixed; z-index: 2; inset: 0; padding: 20px 16px; display: flex; flex-direction: column; gap: 12px; }
  .wait { background: var(--metal); justify-content: center; text-align: center; }
  .wait h1 { font-size: 36px; }
  .passed { background: var(--green); color: #fff; justify-content: center; align-items: center; text-align: center; pointer-events: none; }
  .passed b { font: 700 96px/1 "Barlow Condensed", sans-serif; }
  .passed span { font: 600 30px "Barlow Condensed", sans-serif; }
  .warn { background: var(--yellow); }
  .warn h1 { font-size: 72px; }
  .warn .what { font-size: 27px; font-weight: 600; line-height: 1.2; }
  .warn .said { background: rgba(255,255,255,.65); }
  .warn button {
    font: 700 26px "Barlow Condensed", sans-serif; background: var(--ink); color: #fff;
    border: 0; border-radius: 12px; padding: 14px;
  }
  .warn button:focus-visible { outline: 4px solid var(--blue); outline-offset: 2px; }
  .finished { background: var(--green); color: #fff; justify-content: center; text-align: center; }
  .finished h1 { font-size: 60px; }
</style>
</head>
<body>
  <div>
    <div class="ticks" id="ticks"></div>
    <div class="count" id="count"></div>
  </div>
  <h1 id="title"></h1>
  <p class="instr" id="instr"></p>
  <div class="compare">
    <figure class="expert"><figcaption>Should look like</figcaption><div class="pic"><img id="ref" alt="The expert's work at the end of this step"></div></figure>
    <figure class="yours"><figcaption>Yours now</figcaption><div class="pic"><canvas id="live"></canvas></div></figure>
  </div>
  <p class="hint" id="hint" hidden>Look down at your work so the glasses can see it</p>
  <p class="said" id="said" hidden><small>The expert says</small><span id="said-text"></span></p>

  <div class="cover wait" id="wait"><h1 id="wait-text">Waiting for the glasses</h1></div>
  <div class="cover passed" id="passed" hidden><b>&#10003;</b><span id="passed-text"></span></div>
  <div class="cover warn" id="warn" role="alert" hidden>
    <h1>Stop</h1>
    <p class="what" id="warn-what"></p>
    <div class="compare">
      <figure class="expert"><figcaption>Should look like</figcaption><div class="pic"><img id="warn-ref" alt="The expert's work at the end of this step"></div></figure>
      <figure class="yours"><figcaption>Yours now</figcaption><div class="pic"><canvas id="warn-live"></canvas></div></figure>
    </div>
    <p class="said" id="warn-said" hidden><small>The expert says</small><span id="warn-said-text"></span></p>
    <button id="warn-ok">Got it</button>
  </div>
  <div class="cover finished" id="finished" hidden><h1>All steps done</h1><p id="finished-text"></p></div>

<script>
  const $ = id => document.getElementById(id);
  const NAME = new URLSearchParams(location.search).get('procedure') || 'airplane';
  const WARN_MS = 15000, PASSED_MS = 1400, LOST_TICKS = 3;
  let proc = null, step = null, box = null, frameSize = null, lost = 0, warnTimer = 0, passedTimer = 0;
  const frame = new Image();
  frame.onload = draw;

  function refUrl(k) {
    const crop = proc.steps[k].reference_frame?.crop;
    return crop ? `/procedures/${NAME}/${crop}` : '';
  }

  function render() {
    if (!proc || step === null) return;
    const s = proc.steps[step], n = proc.steps.length;
    $('ticks').innerHTML = proc.steps.map((_, i) =>
      `<i class="${i < step ? 'done' : i === step ? 'now' : ''}"></i>`).join('');
    $('count').textContent = `Step ${step + 1} of ${n}`;
    $('title').textContent = s.title;
    $('instr').textContent = s.instruction;
    $('ref').src = $('warn-ref').src = refUrl(step);
  }

  // The novice's workpiece, cropped the same way as the expert's picture
  function draw() {
    for (const c of [$('live'), $('warn-live')]) {
      const W = frame.naturalWidth, H = frame.naturalHeight;
      let [x, y, w, h] = [0, 0, W, H];
      if (box && frameSize) {
        const k = W / frameSize[0], side = Math.max(box[2] - box[0], box[3] - box[1]) * 1.3 * k;
        x = Math.max(0, (box[0] + box[2]) / 2 * k - side / 2);
        y = Math.max(0, (box[1] + box[3]) / 2 * k - side / 2);
        w = Math.min(W - x, side); h = Math.min(H - y, side);
      }
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(frame, x, y, w, h, 0, 0, w, h);
    }
  }

  function showSaid(text) {
    $('said-text').textContent = text;
    $('said').hidden = false;
  }

  function showWarn(ev) {
    $('warn-what').textContent = ev.what || 'Check this against the expert\'s work';
    $('warn-said').hidden = !ev.play;
    if (ev.play) $('warn-said-text').textContent = ev.play.text;
    $('warn').hidden = false;
    clearTimeout(warnTimer);
    warnTimer = setTimeout(hideWarn, WARN_MS);
  }
  function hideWarn() { $('warn').hidden = true; clearTimeout(warnTimer); }

  function showPassed(k) {
    $('passed-text').textContent = proc ? proc.steps[k].title : '';
    $('passed').hidden = false;
    clearTimeout(passedTimer);
    passedTimer = setTimeout(() => { $('passed').hidden = true; }, PASSED_MS);
  }

  function handle(m) {
    if (m.type === 'frame') {
      frame.src = 'data:image/jpeg;base64,' + m.jpeg;
    } else if (m.type === 'session') {
      if (m.status === 'started') {
        step = null; lost = 0;
        hideWarn();
        $('said').hidden = $('finished').hidden = true;
        $('wait-text').textContent = 'Starting';
        $('wait').hidden = false;
      } else {
        $('wait-text').textContent = 'Session ended';
        $('wait').hidden = false;
      }
    } else if (m.type === 'state') {
      $('wait').hidden = true;
      box = m.box || box; frameSize = m.frame_size;
      lost = m.box ? 0 : lost + 1;
      $('hint').hidden = lost < LOST_TICKS || m.finished;
      if (m.step !== step) {
        step = m.step;
        $('said').hidden = true;
        hideWarn();
        render();
      }
      for (const ev of m.events) {
        if (ev.kind === 'step_done') showPassed(ev.step);
        if (ev.kind === 'instruct' && ev.play) showSaid(ev.play.text);
        if (ev.kind === 'warn') showWarn(ev);
        if (ev.kind === 'complete') {
          hideWarn();
          $('finished-text').textContent = proc?.task || '';
          $('finished').hidden = false;
        }
      }
    }
  }

  function connect() {
    const ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws/guide`);
    ws.onmessage = e => handle(JSON.parse(e.data));
    ws.onclose = () => setTimeout(connect, 1000);
  }

  $('warn-ok').onclick = hideWarn;
  fetch(`/api/procedure/${NAME}`).then(r => r.json()).then(p => { proc = p; render(); });
  connect();
</script>
</body>
</html>
